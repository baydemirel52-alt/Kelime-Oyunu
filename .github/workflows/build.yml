name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gizli Release Keystore Hazirla (GitHub Secrets)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "Gizli Release imzasi basariyla yuklendi."
          else
            echo "Uyari: Gizli imza henuz eklenmemis, gecici imza kullaniliyor."
          fi

      - name: Gradle 8.10.2 Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Magaza Icin Release APK ve AAB Derle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Samsung Store Release APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Efsanesi-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Google Play Release AAB Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Efsanesi-GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
