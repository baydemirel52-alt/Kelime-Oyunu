name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: JDK 17 Kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Sabit Imza (Keystore) Kontrol Et ve Olustur
        run: |
          mkdir -p ~/.android
          if [ ! -f "app/fixed-debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore app/fixed-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/fixed-debug.keystore
            git commit -m "Sabit APK imzasi eklendi"
            git push
          fi
          cp app/fixed-debug.keystore ~/.android/debug.keystore

      - name: Gradle 8.7 Kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Debug APK Derle
        run: gradle assembleDebug --stacktrace

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Kelime-Efsanesi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
